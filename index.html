<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Orderan Ojol Mas Sofyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        .hidden-tab { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-20">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
        
        <header class="bg-blue-600 text-white p-4 text-center">
            <h1 class="text-xl font-bold">Rekap Orderan Ojol</h1>
        </header>

        <div id="tab-upload" class="p-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Jenis Orderan</label>
            <select id="orderType" class="w-full p-2 border rounded mb-4" onchange="toggleForm()">
                <option value="shopee">ShopeeFood</option>
                <option value="indrive">inDrive</option>
            </select>

            <label class="block text-sm font-medium text-gray-700 mb-2">Upload Foto Resi</label>
            <input type="file" id="fotoResi" accept="image/*" capture="environment" class="w-full mb-2 p-2 border rounded" onchange="handleImage(event)">
            
            <p id="ocrStatus" class="text-sm text-blue-500 font-semibold mb-4"></p>

            <div id="form-shopee" class="space-y-3">
                <input type="text" id="shopee-tgl" placeholder="Tanggal (DD MMM YYYY)" class="w-full p-2 border rounded">
                <input type="text" id="shopee-resto" placeholder="Nama Resto" class="w-full p-2 border rounded">
                <input type="number" id="shopee-total" placeholder="Total Pendapatan (Rp)" class="w-full p-2 border rounded">
            </div>

            <div id="form-indrive" class="space-y-3 hidden-tab">
                <input type="text" id="indrive-tgl" placeholder="Tanggal (DD MMM YYYY)" class="w-full p-2 border rounded">
                <input type="text" id="indrive-user" placeholder="Username Pelanggan" class="w-full p-2 border rounded">
                <input type="text" id="indrive-awal" placeholder="Perjalanan Awal" class="w-full p-2 border rounded">
                <input type="text" id="indrive-akhir" placeholder="Perjalanan Akhir" class="w-full p-2 border rounded">
                <input type="number" id="indrive-total" placeholder="Total Diterima (Rp)" class="w-full p-2 border rounded">
            </div>

            <button onclick="submitData()" class="mt-6 w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                Simpan ke Drive & Sheet
            </button>
        </div>

        <div id="tab-analisa" class="p-5 hidden-tab">
            <button onclick="loadAnalisa()" class="w-full bg-blue-500 text-white font-bold py-2 rounded mb-4 shadow">Refresh Analisa</button>
            <div id="analisa-content" class="space-y-4">
                <div class="p-4 bg-gray-50 border rounded shadow-sm">
                    <h3 class="font-bold text-gray-800">ShopeeFood Terlaris</h3>
                    <p id="top-shopee" class="text-lg text-orange-600">-</p>
                </div>
                <div class="p-4 bg-gray-50 border rounded shadow-sm">
                    <h3 class="font-bold text-gray-800">inDrive Terlaris (Rute)</h3>
                    <p id="top-indrive" class="text-lg text-green-600">-</p>
                </div>
                <div class="p-4 bg-gray-50 border rounded shadow-sm">
                    <h3 class="font-bold text-gray-800">Total Pendapatan Keseluruhan</h3>
                    <p id="total-semua" class="text-2xl font-bold text-blue-600">Rp 0</p>
                </div>
            </div>
        </div>

        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around p-3 shadow-lg z-50">
            <button onclick="switchTab('upload')" class="text-blue-600 font-semibold flex-1 text-center">Upload Resi</button>
            <button onclick="switchTab('analisa')" class="text-blue-600 font-semibold flex-1 text-center border-l">Analisa Data</button>
        </nav>
    </div>

    <script>
        // GANTI BAGIAN DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
        const GAS_URL = "URL_WEB_APP_GAS_ANDA"; 
        
        let base64Image = "";

        function switchTab(tab) {
            document.getElementById('tab-upload').classList.add('hidden-tab');
            document.getElementById('tab-analisa').classList.add('hidden-tab');
            document.getElementById('tab-' + tab).classList.remove('hidden-tab');
            if(tab === 'analisa') loadAnalisa();
        }

        function toggleForm() {
            const type = document.getElementById('orderType').value;
            if (type === 'shopee') {
                document.getElementById('form-shopee').classList.remove('hidden-tab');
                document.getElementById('form-indrive').classList.add('hidden-tab');
            } else {
                document.getElementById('form-shopee').classList.add('hidden-tab');
                document.getElementById('form-indrive').classList.remove('hidden-tab');
            }
        }

        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('ocrStatus').innerText = "Sedang kompresi & membaca resi...";
            
            const options = { maxSizeMB: 0.3, maxWidthOrHeight: 1024, useWebWorker: true };
            const compressedFile = await imageCompression(file, options);
            base64Image = await imageCompression.getDataUrlFromFile(compressedFile);

            Tesseract.recognize(compressedFile, 'ind').then(({ data: { text } }) => {
                document.getElementById('ocrStatus').innerText = "Teks berhasil dibaca! Silakan periksa kembali datanya.";
                parseOCR(text, document.getElementById('orderType').value);
            }).catch(err => {
                document.getElementById('ocrStatus').innerText = "Gagal membaca teks otomatis. Silakan isi manual.";
                console.error(err);
            });
        }

        function parseOCR(text, type) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const fullText = lines.join(' '); 

            const tglMatch = fullText.match(/\b\d{1,2}\s+(Jan|Feb|Mar|Apr|Mei|Jun|Jul|Agt|Sep|Okt|Nov|Des)\s+\d{4}\b/i);
            const tgl = tglMatch ? tglMatch[0] : new Date().toLocaleDateString('id-ID');

            const totalMatch = fullText.match(/Rp\s*([\d\.,]+)/i);
            let total = '';
            if (totalMatch) {
                total = totalMatch[1].replace(/\./g, ''); 
                total = total.split(',')[0]; 
            }

            if (type === 'shopee') {
                document.getElementById('shopee-tgl').value = tgl;
                document.getElementById('shopee-total').value = total;

                let restoIndex = -1;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].toLowerCase().includes('shopeefood') || lines[i].toLowerCase().includes('rp')) {
                        restoIndex = i + 1; 
                        break;
                    }
                }

                let resto = '';
                if (restoIndex !== -1 && restoIndex < lines.length) {
                     resto = lines[restoIndex];
                     if (resto.toLowerCase().includes('alamat pelanggan')) {
                         resto = ''; 
                     }
                }
                
                if (!resto) {
                     const excludeWords = ['riwayat', 'pesanan', 'selesai', 'dibatalkan', 'shopeefood', 'total', 'pendapatan', 'alamat', 'pelanggan', 'disembunyikan', 'akhir', 'daftar', 'rp'];
                     for (let line of lines) {
                         let isResto = true;
                         let lineLower = line.toLowerCase();
                         if (lineLower.match(/\b\d{1,2}\s+(jan|feb|mar|apr|mei|jun|jul|agt|sep|okt|nov|des)\s+\d{4}\b/)) continue;
                         
                         for (let word of excludeWords) {
                             if (lineLower.includes(word)) {
                                 isResto = false;
                                 break;
                             }
                         }
                         if (isResto && line.length > 3) { 
                             resto = line;
                             break;
                         }
                     }
                }
                document.getElementById('shopee-resto').value = resto.replace(/^[^\w\s]+/g, '').trim();

            } else {
                // --- UPDATE LOGIKA INDRIVE ---
                document.getElementById('indrive-tgl').value = tgl;
                document.getElementById('indrive-total').value = total;
                
                let awal = '', akhir = '', username = '';
                
                // 1. CARI RUTE
                let startRouteIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                    let text = lines[i].toLowerCase();
                    // Deteksi "dalam kota" atau "selesai" (meski dipisah karakter aneh)
                    if (text.includes('selesai') || text.includes('dalam kota')) {
                        startRouteIdx = i;
                        // Jangan di-break, agar jika dua kata ini beda baris, ia ambil yang paling bawah
                    }
                }

                let endRouteIdx = lines.length;
                for (let i = startRouteIdx + 1; i < lines.length; i++) {
                    let text = lines[i].toLowerCase();
                    // Titik berhenti pencarian rute
                    if (text.includes('durasi') || text.includes('jarak') || text.includes('mnt')) {
                        endRouteIdx = i;
                        break;
                    }
                }

                if (startRouteIdx !== -1) {
                    const ruteLines = [];
                    for(let i = startRouteIdx + 1; i < endRouteIdx; i++) {
                        let text = lines[i].trim();
                        // Abaikan baris yang isinya cuma format jam (misal 18:10 atau 18.10)
                        if(!text.match(/^\d{1,2}[:\.]\d{2}$/)) {
                            ruteLines.push(text);
                        }
                    }
                    
                    if (ruteLines.length > 0) {
                        awal = ruteLines[0]; // Baris teratas setelah filter jam
                    }
                    if (ruteLines.length > 1) {
                        akhir = ruteLines[ruteLines.length - 1]; // Baris terbawah sblm durasi
                    }
                }

                // 2. CARI USERNAME 
                let menilaiIdx = -1;
                for (let i = 0; i < lines.length; i++) {
                     let text = lines[i].toLowerCase();
                     // Cari baris bawah sebagai patokan
                     if (text.includes('menilai') || text.includes('resi') || text.includes('dukungan')) {
                         menilaiIdx = i;
                         break;
                     }
                }
                
                if (menilaiIdx > 0) {
                    for (let i = menilaiIdx - 1; i >= 0; i--) {
                        let text = lines[i].toLowerCase();
                        // Naik ke atas, hindari mengambil teks durasi/jarak/jam
                        if (!text.includes('durasi') && !text.includes('jarak') && !text.includes('mnt') && !text.includes('km') && !text.match(/^\d{1,2}[:\.]\d{2}$/)) {
                            username = lines[i];
                            break;
                        }
                    }
                }
                
                // Menghapus ikon (seperti emotikon atau pin maps) yang terbaca sebagai simbol
                document.getElementById('indrive-awal').value = awal.replace(/^[^\w\s]+/g, '').trim();
                document.getElementById('indrive-akhir').value = akhir.replace(/^[^\w\s]+/g, '').trim();
                document.getElementById('indrive-user').value = username.replace(/^[^\w\s]+/g, '').trim();
            }
        }

        async function submitData() {
            const type = document.getElementById('orderType').value;
            if(!base64Image) return alert("Pilih foto resi terlebih dahulu!");
            
            const btn = document.querySelector('button[onclick="submitData()"]');
            btn.innerText = "Menyimpan (Tunggu sebentar)..."; 
            btn.disabled = true;

            let payload = { type: type, photo: base64Image };

            if (type === 'shopee') {
                payload.tanggal = document.getElementById('shopee-tgl').value;
                payload.resto = document.getElementById('shopee-resto').value;
                payload.total = document.getElementById('shopee-total').value;
            } else {
                payload.tanggal = document.getElementById('indrive-tgl').value;
                payload.username = document.getElementById('indrive-user').value;
                payload.awal = document.getElementById('indrive-awal').value;
                payload.akhir = document.getElementById('indrive-akhir').value;
                payload.total = document.getElementById('indrive-total').value;
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    alert("Orderan berhasil dicatat!");
                    window.location.reload();
                } else {
                    alert("Gagal menyimpan: " + result.message);
                }
            } catch (error) {
                alert("Error jaringan. Pastikan URL GAS sudah benar.");
                console.error(error);
            }
            btn.innerText = "Simpan ke Drive & Sheet"; 
            btn.disabled = false;
        }

        async function loadAnalisa() {
            document.getElementById('total-semua').innerText = "Memuat data...";
            try {
                const response = await fetch(GAS_URL);
                const res = await response.json();
                
                let shopeeTotal = 0, indriveTotal = 0;
                let shopeeCounts = {}, indriveCounts = {};

                res.shopee.slice(1).forEach(row => {
                    const resto = row[1];
                    const hrg = parseInt(row[2]) || 0;
                    shopeeTotal += hrg;
                    if(resto) shopeeCounts[resto] = (shopeeCounts[resto] || 0) + 1;
                });

                res.indrive.slice(1).forEach(row => {
                    const rute = row[2] + " ➡️ " + row[3];
                    const hrg = parseInt(row[4]) || 0;
                    indriveTotal += hrg;
                    if(row[2] && row[3]) indriveCounts[rute] = (indriveCounts[rute] || 0) + 1;
                });

                const topShopee = Object.keys(shopeeCounts).sort((a,b) => shopeeCounts[b] - shopeeCounts[a])[0] || "Belum ada data";
                const topIndrive = Object.keys(indriveCounts).sort((a,b) => indriveCounts[b] - indriveCounts[a])[0] || "Belum ada data";

                document.getElementById('top-shopee').innerText = topShopee + " (" + (shopeeCounts[topShopee]||0) + " order)";
                document.getElementById('top-indrive').innerText = topIndrive + " (" + (indriveCounts[topIndrive]||0) + " kali)";
                document.getElementById('total-semua').innerText = "Rp " + (shopeeTotal + indriveTotal).toLocaleString('id-ID');
            } catch(e) {
                document.getElementById('total-semua').innerText = "Gagal memuat data dari Spreadsheet.";
                console.error(e);
            }
        }
    </script>
</body>
</html>
